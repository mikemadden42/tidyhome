name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: zig fmt --check .
      - run: zig build test
      - run: zig build test --release=safe

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Release modes
        run: |
          zig build
          zig build --release=safe
          zig build --release=fast
          zig build --release=small
      - name: Cross compile
        run: |
          for target in \
            x86_64-linux aarch64-linux \
            x86_64-windows aarch64-windows \
            aarch64-macos x86_64-macos \
            x86_64-freebsd; do
            zig build -Dtarget="$target" --release=safe -p "zig-out/$target"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: tidyhome
          path: zig-out/*/bin/*
