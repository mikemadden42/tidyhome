name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # No version given: uses minimum_zig_version from build.zig.zon.
      - uses: mlugg/setup-zig@v2
      # Formatting is platform-independent, so checking it once is enough.
      - name: Check formatting
        if: runner.os == 'Linux'
        run: zig fmt --check .
      - run: zig build
      - run: zig build test --summary all
      - run: zig build test --release=safe --summary all

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
      - name: Release modes
        run: |
          zig build --release=safe
          zig build --release=fast
          zig build --release=small
      - name: Cross compile
        run: |
          for target in \
            x86_64-linux aarch64-linux \
            x86_64-windows aarch64-windows \
            aarch64-macos x86_64-macos \
            x86_64-freebsd; do
            zig build -Dtarget="$target" --release=safe -p "zig-out/$target"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: tidyhome
          path: zig-out/*/bin/*

  zig-nightly:
    # Early warning for breaking changes to std.process.Init and std.Io.
    # Allowed to fail so it never blocks a merge.
    name: Test (Zig nightly)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: master
      - run: zig build
      - run: zig build test --summary all
